[package]
name = "TUI-Reader"
version = "0.1.0"
edition = "2024"

[dependencies]
color-eyre = "0.6.5"
crossterm = "0.29.0"
image = { version = "0.25.6", default-features = false, features = ["png"] }
ratatui = { version = "0.30.2", features = ["crossterm"] }

# ターミナルの画像方式を問い合わせ、画像をその方式のデータへ変換するライブラリ
ratatui-image = { version = "11.1.0", default-features = false, features = ["crossterm", "image-defaults"] }

mupdf = { version = "0.8.0", default-features = false, features = ["base14-fonts", "system-fonts"] }

