name: Codex PR review
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
concurrency:
  group: codex-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  review:
    if: >-
      vars.CODEX_ACTION_ENABLED == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == github.repository_owner &&
      !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      message: ${{ steps.codex.outputs.final-message }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Codexでレビュー
        id: codex
        uses: openai/codex-action@86365089eb2b84e0a8fb0717b304f8bdcb13b20e # v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt: |
            PRの差分をレビューし、具体的な不具合を日本語で説明してください。
            git diff ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }} と関連コードを確認してください。
            指摘にはファイル、行番号、不具合が起きる条件を記載してください。
            ファイルは変更しないでください。
          sandbox: read-only
          safety-strategy: drop-sudo
  feedback:
    needs: review
    if: needs.review.outputs.message != ''
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          CODEX_REVIEW: ${{ needs.review.outputs.message }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: process.env.CODEX_REVIEW
            });
